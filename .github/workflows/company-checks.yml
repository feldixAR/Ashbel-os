name: Company foundation checks

on:
  push:
    branches:
      - qa/company-foundation
      - feat/durable-business-events
  pull_request:
    branches:
      - master
      - qa/company-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: .
      ASHBEL_SOURCE_CONTEXT_ENABLED: "false"
      ASHBEL_BUSINESS_EVENTS_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full isolated regression suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-regression-results
          path: test-results.xml
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ashbel_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ashbel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      ENV: test
      TEST_POSTGRES_URL: postgresql://ci:disposable-ci-only@localhost:5432/ashbel_ci
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: PostgreSQL multi-process and restart checks
        run: python -m pytest -q tests/test_postgres_claims.py --junitxml=postgres-results.xml
      - name: Preserve PostgreSQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-postgres-results
          path: postgres-results.xml
          retention-days: 7
